[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agas-cilindros-backend"
version = "1.0.0"
description = "Sistema Web de Gestión, Valorización y Trazabilidad de Cilindros de Gas para AGAS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
    "email-validator>=2.1.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
prod = [
    "gunicorn>=22.0.0",
    "uvloop>=0.19.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "Q", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "TID", "TCH", "EXE", "ISC", "ICN", "LOG", "PERF", "PYI", "TD", "ANN"]
ignore = ["ANN001", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401", "ARG001", "ARG002", "B008", "C408", "D100", "D101", "D102", "D103", "D104", "D107", "ERA001", "EXE005", "INP001", "ISC002", "N802", "N818", "PIE796", "PLC0415", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "PLW0602", "PLW0603", "PTH118", "PTH123", "Q000", "RET503", "RET504", "RUF012", "S101", "S311", "SLF001", "T201", "T203", "TC002", "TC003", "TRY003", "UP006", "UP007", "UP035"]
# F821 en app/models: forward references de SQLAlchemy 2.0 (resueltas en runtime
# por el registry declarativo). Import/ejecución verificados.
per-file-ignores = { "app/models/*" = ["F821"], "tests/*" = ["S101", "S106", "S311", "PLW0603"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]
show_missing = true