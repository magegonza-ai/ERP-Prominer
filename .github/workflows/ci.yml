name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check app scripts alembic tests

  # ============================================================
  # TESTS (pytest + PostgreSQL real)
  # ============================================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agas_user
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: agas_cilindros_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agas_user -d agas_cilindros_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Entorno de pruebas: sin backend/.env (está en .gitignore),
      # todos los valores requeridos por app.config.Settings se declaran aquí
      # y en tests/conftest.py.
      ENVIRONMENT: test
      SECRET_KEY: "test-secret-key-ci-xxxxxxxxxxxxxxxxxxxx"
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: agas_user
      DATABASE_PASSWORD: testpassword123
      DATABASE_NAME: agas_cilindros_test
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key-123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Pytest con cobertura
        run: pytest --cov=app --cov-report=term-missing

  # ============================================================
  # DOCKER (validar compose + build de la imagen)
  # ============================================================
  docker:
    name: Docker (compose + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose (dev)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validar docker-compose (prod)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build imagen del backend
        run: docker build -t agas-cilindros-api:ci backend
