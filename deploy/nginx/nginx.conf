# ==============================================================
# AGAS Cilindros - nginx reverse proxy (producción)
# Sirve la API y deja espacio para el frontend en /.
# ==============================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    upstream agas_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check directo
        location = /health {
            proxy_pass http://agas_api;
            proxy_set_header Host $host;
        }

        # API REST
        location /api/ {
            proxy_pass http://agas_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # Docs (Solo habilitadas en DEBUG; en prod la app no expone /docs)
        location = /docs {
            return 404;
        }

        # Frontend (cuando exista)
        location / {
            return 200 "AGAS Cilindros API - OK";
            add_header Content-Type text/plain;
        }
    }
}