name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check app scripts alembic tests

  # ============================================================
  # TESTS (pytest + PostgreSQL real)
  # ============================================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agas_user
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: agas_cilindros_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agas_user -d agas_cilindros_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Entorno de pruebas: sin backend/.env (está en .gitignore),
      # todos los valores requeridos por app.config.Settings se declaran aquí
      # y en tests/conftest.py.
      ENVIRONMENT: test
      # Sin la BD disponible los tests de BD deben FALLAR, no hacer skip
      # (evita un "falso verde" del pipeline).
      TESTS_REQUIRE_DB: "1"
      SECRET_KEY: "test-secret-key-ci-xxxxxxxxxxxxxxxxxxxx"
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: agas_user
      DATABASE_PASSWORD: testpassword123
      DATABASE_NAME: agas_cilindros_test
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key-123
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Pytest con cobertura
        run: |
          pytest --cov=app --cov-report=term-missing | tee pytest-out.txt
          echo "::notice::$(grep -E '[0-9]+ (passed|failed)' pytest-out.txt | tail -n 1 | sed 's/=//g; s/^ *//; s/ *$//')"

  # ============================================================
  # DOCKER (validar compose + build de la imagen)
  # ============================================================
  docker:
    name: Docker (compose + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar docker-compose (dev)
        run: |
          if ! OUT=$(docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet 2>&1); then
            echo "::error::docker compose config (dev) falló: $OUT"
            exit 1
          fi

      - name: Validar docker-compose (prod)
        run: |
          if ! OUT=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>&1); then
            echo "::error::docker compose config (prod) falló: $OUT"
            exit 1
          fi

      - name: Build imagen del backend
        run: docker build -t agas-cilindros-api:ci backend
