# ==============================================================
# AGAS Cilindros - Override de PRODUCCIÓN
# Uvicorn multi-worker, políticas de reinicio estrictas y nginx como proxy.
# Requiere llaves JWT y valores reales en el entorno.
# ==============================================================

services:
  postgres:
    restart: always
    ports: []
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups/init:/docker-entrypoint-initdb.d:ro

  redis:
    restart: always
    ports: []

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    ports: []
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definir MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD}

  api:
    restart: always
    ports: []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
    volumes:
      - jwt_secrets:/app/secrets:ro
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: agas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  redisdata:
  miniodata:
  jwt_secrets: